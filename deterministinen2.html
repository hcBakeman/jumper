<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NEON REBOUND: WORLD CHAMPIONSHIP</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { 
            --neon: #00f2ff; 
            --bg: #0d0221; 
            --warning: #ff0055; 
            --pulse-color: rgba(0, 242, 255, 0.03); /* Tausta ei mene valkoiseksi */
            --gold: #ffd700;
        }

        body { 
            margin: 0; 
            background: var(--bg); 
            color: white; 
            font-family: 'Segoe UI', sans-serif; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }

        @keyframes breathe {
            0% { background-color: var(--bg); }
            50% { background-color: var(--pulse-color); }
            100% { background-color: var(--bg); }
        }

        .pulsing { 
            animation: breathe 3.25s infinite ease-in-out; 
            width: 100vw; height: 100vh;
            display: flex; flex-direction: column; align-items: center;
        }

        #setup-menu { margin-top: 40px; text-align: center; z-index: 10; width: 340px; }
        #game-container { position: relative; width: 400px; height: 600px; border: 4px solid #1a1a2e; overflow: hidden; background: #050110; box-shadow: 0 0 50px rgba(0,0,0,0.5); }
        
        .platform { position: absolute; height: 10px; background: #5465ff; box-shadow: 0 0 10px #5465ff; border-radius: 5px; z-index: 10; will-change: transform; }
        .player-box { position: absolute; width: 25px; height: 25px; border-radius: 4px; z-index: 20; will-change: transform; }
        #player { background: var(--neon); box-shadow: 0 0 15px var(--neon); }
        #opponent { background: #ff00ff; box-shadow: 0 0 15px #ff00ff; opacity: 0.8; display: none; }
        
        /* UI Elementit */
        #seed-leaderboard { position: absolute; top: 20px; right: 20px; width: 220px; background: rgba(13, 2, 33, 0.9); border-left: 3px solid var(--neon); padding: 15px; font-family: 'Courier New', monospace; z-index: 5; border: 1px solid rgba(0, 242, 255, 0.1); }
        #live-leaderboard { position: absolute; top: 0; left: -220px; width: 180px; background: rgba(26, 26, 46, 0.9); border-right: 3px solid var(--neon); padding: 15px; border-radius: 8px 0 0 8px; font-family: 'Courier New', monospace; z-index: 500; }
        .game-wrapper { position: relative; display: none; margin-top: 20px; }
        #ui { position: absolute; top: 10px; left: 10px; right: 10px; z-index: 100; font-weight: bold; display: flex; justify-content: space-between; }
        #overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.95); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 1100; }
        .name-tag { position: absolute; width: 100px; text-align: center; left: -37.5px; top: -20px; font-size: 10px; font-weight: bold; text-transform: uppercase; }

        /* Painikkeet ja Inputit */
        .start-btn { padding: 12px 24px; background: var(--neon); border: none; font-weight: bold; cursor: pointer; margin: 5px; border-radius: 8px; text-transform: uppercase; width: 100%; }
        .start-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .secondary-btn { padding: 8px 16px; background: transparent; border: 1px solid #5465ff; color: #5465ff; cursor: pointer; border-radius: 8px; text-transform: uppercase; font-size: 11px; margin: 5px; }
        input[type="text"] { padding: 12px; border-radius: 8px; border: 1px solid #333; background: #1a1a2e; color: white; margin-bottom: 5px; text-align: center; width: 100%; box-sizing: border-box; }
    </style>
</head>
<body class="pulsing">

<div id="main-body">
    <div id="seed-leaderboard">
        <div style="font-size: 11px; color: var(--neon); font-weight: bold; border-bottom: 1px solid rgba(0,242,255,0.2); margin-bottom: 10px;">SEED RECORDS</div>
        <div id="seed-list-content">Syncing...</div>
    </div>

    <div id="setup-menu">
        <h1 style="color: var(--neon); letter-spacing: 4px;">NEON REBOUND</h1>
        <input type="text" id="name-input" placeholder="ENTER PILOT NAME" maxlength="12" oninput="updateMyName()">
        <div id="player-list" style="background: rgba(255,255,255,0.05); padding: 10px; margin: 15px 0; border-radius: 8px; text-align: left; font-size: 13px;">
            <div id="lobby-list-content">Lobby empty...</div>
        </div>
        <input type="text" id="seed-input" placeholder="MISSION_SEED">
        <button class="start-btn" id="main-start-btn" onclick="requestStart()" disabled>Launch Mission</button>
        
        <div id="multiplayer-menu" style="margin-top: 15px; border-top: 1px solid #333; padding-top: 10px;">
            <div id="my-id-container" onclick="copyId()" style="cursor: pointer; font-size: 11px; margin-bottom: 10px; color: var(--neon);">ID: CONNECTING...</div>
            <input type="text" id="join-id" placeholder="PASTE FRIEND'S ID">
            <button id="connect-btn" class="secondary-btn" style="width: 100%;" onclick="connectToPeer()">CONNECT TO PILOT</button>
        </div>
    </div>

    <div class="game-wrapper" id="game-wrapper">
        <div id="game-container">
            <div id="ui"><div>SCORE: <span id="score">0</span></div></div>
            <div id="player" class="player-box"><div class="name-tag" id="my-name-tag"></div></div>
            <div id="opponent" class="player-box"><div class="name-tag" id="opp-name-tag"></div></div>
            <div id="overlay">
                <h1 style="color: var(--warning);">MISSION FAILED</h1>
                <table id="final-leaderboard" style="width: 80%; color: white; margin-bottom: 20px;"></table>
                <div id="host-controls">
                    <button class="start-btn" onclick="requestStart()">Rematch</button>
                    <button class="secondary-btn" onclick="location.reload()" style="color: white; width: 100%;">Exit</button>
                </div>
            </div>
        </div>
        <div id="live-leaderboard">
            <div style="font-size: 10px; color: var(--neon); margin-bottom: 10px;">LIVE TRACKING</div>
            <div id="live-list-content-game"></div>
        </div>
    </div>
</div>

<script>
    const peer = new Peer();
    let conn;
    let isHost = true, isConnected = false, isRunning = false;
    let player = { x: 185, y: 500, vx: 0, vy: 0, name: "" };
    let opponent = { x: 185, absY: 500, targetX: 185, targetAbsY: 500, dead: false, active: false, name: "CO-PILOT", score: 0 };
    let platforms = [], cameraY = 0, highestWorldY = 600, keys = {}, lastTime = 0;
    let currentSeedText = "", globalSeed = 0;
    window.myAbsHeight = 0;

    // P2P Yhteys
    peer.on('open', id => { document.getElementById('my-id-container').innerText = "ID: " + id + " (CLICK TO COPY)"; });
    peer.on('connection', c => { conn = c; isHost = true; isConnected = true; setupConn(); });

    function copyId() { navigator.clipboard.writeText(peer.id); alert("ID Copied!"); }

    function connectToPeer() {
        const id = document.getElementById('join-id').value.trim();
        if(!id) return;
        conn = peer.connect(id);
        isHost = false; isConnected = true;
        setupConn();
    }

    function setupConn() {
        conn.on('open', () => {
            conn.send({ type: 'name', name: player.name });
            conn.on('data', data => {
                if(data.type === 'name') { opponent.name = data.name; opponent.active = true; updateLobbyUI(); }
                if(data.type === 'start') initGame(data.seed);
                if(data.type === 'pos') {
                    opponent.targetX = data.x;
                    opponent.targetAbsY = data.absY;
                    opponent.dead = data.dead;
                    opponent.score = data.score;
                }
            });
        });
    }

    function updateMyName() {
        player.name = document.getElementById('name-input').value.trim();
        document.getElementById('main-start-btn').disabled = player.name.length < 2;
        updateLobbyUI();
    }

    function updateLobbyUI() {
        let html = `<div>• ${player.name || 'YOU'} (LOCAL)</div>`;
        if (opponent.active) html += `<div style="color:var(--neon)">• ${opponent.name} (CONNECTED)</div>`;
        document.getElementById('lobby-list-content').innerHTML = html;
    }

    function requestStart() {
        const seed = document.getElementById('seed-input').value || "MISSION_1";
        if (isConnected && isHost) conn.send({ type: 'start', seed: seed });
        initGame(seed);
    }

    function initGame(seed) {
        currentSeedText = seed;
        globalSeed = seed.split('').reduce((a,b) => (a << 5) - a + b.charCodeAt(0), 0);
        isRunning = true; window.isGameOver = false;
        player.x = 185; player.y = 500; player.vy = 0;
        cameraY = 0; highestWorldY = 600; window.myAbsHeight = 0;
        platforms = [];
        
        document.querySelectorAll('.platform').forEach(p => p.remove());
        document.getElementById('setup-menu').style.display = 'none';
        document.getElementById('game-wrapper').style.display = 'block';
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('my-name-tag').innerText = player.name;
        document.getElementById('opp-name-tag').innerText = opponent.name;

        // Aloitustasot
        spawnPlatformAt(550);
        while (highestWorldY > -100) { highestWorldY -= 80; spawnPlatformAt(highestWorldY); }
        
        requestAnimationFrame(gameLoop);
    }

    function spawnPlatformAt(worldY) {
        let rand = Math.sin(worldY + globalSeed) * 10000;
        rand = rand - Math.floor(rand);
        let score = Math.abs(worldY) / 10;
        let w = 70 + rand * 30;
        let x = rand * (400 - w);
        
        // Liike alkaa heti 20 pisteen jälkeen
        let mvSpeed = score > 20 ? (rand > 0.5 ? 1 : -1) * (50 + score) : 0;
        
        const el = document.createElement('div');
        el.className = 'platform';
        el.style.width = w + 'px';
        document.getElementById('game-container').appendChild(el);
        platforms.push({ x, worldY, w, el, mvSpeed, seedOffset: rand * 10 });
    }

    function gameLoop(timestamp) {
        if (!isRunning) return;
        let dt = (timestamp - lastTime) / 1000;
        lastTime = timestamp;
        if (dt > 0.1) dt = 0.016;

        let timeSecs = performance.now() / 1000;

        // Tasojen liike (Nopeampi DOM + Siniaalto-sync)
        platforms.forEach(p => {
            if (p.mvSpeed !== 0) {
                let range = (400 - p.w) / 2;
                let center = 200 - p.w / 2;
                p.x = center + Math.sin(timeSecs * (Math.abs(p.mvSpeed)/60) + p.seedOffset) * range;
            }
        });

        if (!window.isGameOver) {
            updatePlayer(dt);
        } else if (opponent.active && !opponent.dead) {
            // Spectate-kamera seuraa kaveria
            let targetCam = 300 - opponent.targetAbsY;
            cameraY += (targetCam - cameraY) * 0.1;
        }

        if (isConnected) conn.send({ type: 'pos', x: player.x, absY: player.y - cameraY, dead: window.isGameOver, score: Math.floor(window.myAbsHeight) });

        render();
        updateLiveUI();

        if (window.isGameOver && (!opponent.active || opponent.dead)) {
            showEndScreen();
        } else {
            requestAnimationFrame(gameLoop);
        }
    }

    function updatePlayer(dt) {
        if (keys['ArrowLeft']) player.vx = -400;
        else if (keys['ArrowRight']) player.vx = 400;
        else player.vx *= 0.8;

        player.vy += 1600 * dt;
        player.x += player.vx * dt;
        player.y += player.vy * dt;

        if (player.x > 400) player.x = -25;
        if (player.x < -25) player.x = 400;

        platforms.forEach(p => {
            let screenY = p.worldY + cameraY;
            if (player.vy > 0 && player.x + 25 > p.x && player.x < p.x + p.w && player.y + 25 > screenY && player.y + 25 < screenY + 15) {
                player.vy = -650;
            }
        });

        if (player.y < 300) {
            let diff = 300 - player.y;
            cameraY += diff;
            window.myAbsHeight += diff / 10;
            player.y = 300;
            document.getElementById('score').innerText = Math.floor(window.myAbsHeight);
            while (highestWorldY > -cameraY - 100) { highestWorldY -= 80; spawnPlatformAt(highestWorldY); }
        }

        if (player.y > 600) window.isGameOver = true;
    }

    function render() {
        // GPU-kiihdytetty renderöinti transformilla
        const pEl = document.getElementById('player');
        pEl.style.transform = `translate(${player.x}px, ${player.y}px)`;
        pEl.style.display = window.isGameOver ? 'none' : 'block';
        
        if (opponent.active) {
            const oEl = document.getElementById('opponent');
            oEl.style.display = 'block';
            oEl.style.transform = `translate(${opponent.targetX}px, ${opponent.targetAbsY + cameraY}px)`;
            oEl.style.opacity = opponent.dead ? "0.2" : "0.8";
        }
        
        platforms.forEach(p => {
            p.el.style.transform = `translate(${p.x}px, ${p.worldY + cameraY}px)`;
        });
    }

    function updateLiveUI() {
        let pList = [{n: player.name, s: Math.floor(window.myAbsHeight), d: window.isGameOver}];
        if(opponent.active) pList.push({n: opponent.name, s: opponent.score, d: opponent.dead});
        pList.sort((a,b) => b.s - a.s);
        document.getElementById('live-list-content-game').innerHTML = pList.map(p => 
            `<div style="margin-bottom:8px; color:${p.d?'red':'#00ff00'}">
                <small>${p.d?'[OUT]':'[LIVE]'} ${p.n}</small><br><b>${p.s}</b>
            </div>`).join('');
    }

    function showEndScreen() {
        document.getElementById('overlay').style.display = 'flex';
        let pilots = [{ n: player.name, s: Math.floor(window.myAbsHeight) }];
        if (opponent.active) pilots.push({ n: opponent.name, s: opponent.score });
        pilots.sort((a,b) => b.s - a.s);
        document.getElementById('final-leaderboard').innerHTML = pilots.map(p => `<tr><td>${p.n}</td><td style="text-align:right">${p.s}</td></tr>`).join('');
    }

    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);
</script>

</body>
</html>
