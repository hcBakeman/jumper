<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NEON REBOUND: WORLD CHAMPIONSHIP</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { 
            --neon: #00f2ff; 
            --bg: #0d0221; 
            --warning: #ff0055; 
            --pulse-color: rgba(0, 242, 255, 0.03);
        }

        body { 
            margin: 0; 
            background: var(--bg); 
            color: white; 
            font-family: 'Segoe UI', sans-serif; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }

        @keyframes breathe {
            0% { background-color: var(--bg); }
            50% { background-color: var(--pulse-color); }
            100% { background-color: var(--bg); }
        }

        .pulsing { 
            animation: breathe 3.25s infinite ease-in-out; 
            width: 100vw; height: 100vh;
            display: flex; flex-direction: column; align-items: center;
        }

        #setup-menu { margin-top: 40px; text-align: center; z-index: 10; width: 340px; }
        
        .game-wrapper {
            position: relative;
            display: none; 
            margin-top: 20px;
        }

        #game-container { 
            position: relative; 
            width: 400px; 
            height: 600px; 
            border: 4px solid #1a1a2e; 
            overflow: hidden; 
            background: #050110; 
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        #live-leaderboard {
            position: absolute;
            top: 0;
            left: 420px; 
            width: 180px;
            background: rgba(26, 26, 46, 0.9);
            border-left: 3px solid var(--neon);
            padding: 15px;
            border-radius: 0 8px 8px 0;
            font-family: 'Courier New', Courier, monospace;
            z-index: 500;
        }

        .leaderboard-title {
            font-size: 10px;
            color: var(--neon);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(0, 242, 255, 0.2);
            padding-bottom: 5px;
        }

        .player-box { position: absolute; width: 25px; height: 25px; border-radius: 4px; z-index: 20; }
        #player { background: var(--neon); box-shadow: 0 0 15px var(--neon); }
        #opponent { background: #ff00ff; box-shadow: 0 0 15px #ff00ff; opacity: 0.8; display: none; }

        .name-tag { position: absolute; width: 100px; text-align: center; left: -37.5px; top: -20px; font-size: 10px; font-weight: bold; text-transform: uppercase; white-space: nowrap; }

        .platform { position: absolute; height: 10px; background: #5465ff; box-shadow: 0 0 10px #5465ff; border-radius: 5px; z-index: 10; }
        
        #ui { position: absolute; top: 10px; left: 10px; right: 10px; z-index: 100; font-weight: bold; display: flex; justify-content: space-between; }
        .ui-element { font-size: 18px; text-shadow: 0 0 5px rgba(0,0,0,0.5); }
        
        .live-entry { margin-bottom: 8px; font-size: 14px; display: flex; flex-direction: column; }
        .live-score { font-size: 18px; font-weight: bold; }

        #host-left-alert {
            position: absolute; top: 0; width: 100%; background: var(--warning);
            color: white; text-align: center; font-size: 12px; font-weight: bold;
            padding: 4px 0; z-index: 1000; display: none;
        }

        #announce { position: absolute; width: 100%; top: 100px; text-align: center; color: var(--warning); font-size: 40px; font-weight: 900; display: none; z-index: 150; text-shadow: 0 0 20px var(--warning); letter-spacing: 5px; }
        
        #spec-msg { 
            position: absolute; 
            width: 100%; 
            top: 80px; 
            text-align: center; 
            color: var(--warning); 
            display: none; 
            font-weight: bold; 
            z-index: 1000;
            text-transform: uppercase;
            font-size: 16px;
            letter-spacing: 2px;
            background: rgba(0,0,0,0.7);
            padding: 12px 0;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        #overlay { 
            position: absolute; inset: 0; background: rgba(0,0,0,0.9); 
            display: none; flex-direction: column; align-items: center; 
            justify-content: center; z-index: 1100; 
        }

        #player-list {
            background: rgba(255, 255, 255, 0.05); border-radius: 8px;
            padding: 10px; margin: 15px 0; text-align: left;
        }
        .player-entry { font-size: 13px; margin: 4px 0; display: flex; justify-content: space-between; }
        .status-dot { width: 8px; height: 8px; background: #00ff00; border-radius: 50%; display: inline-block; margin-right: 8px; }

        .score-board { margin: 15px 0; width: 80%; border-collapse: collapse; }
        .score-board td { padding: 8px; border-bottom: 1px solid #333; }
        .winner { color: gold; font-weight: bold; text-shadow: 0 0 10px gold; }

        .start-btn { 
            padding: 12px 24px; background: var(--neon); border: none; 
            font-weight: bold; cursor: pointer; margin: 5px; border-radius: 8px;
            box-shadow: 0 0 10px var(--neon); text-transform: uppercase;
        }
        .secondary-btn { 
            padding: 8px 16px; background: transparent; border: 1px solid #5465ff; 
            color: #5465ff; cursor: pointer; border-radius: 8px; text-transform: uppercase; font-size: 11px; margin: 5px;
        }

        input[type="text"] { padding: 10px; border-radius: 8px; border: 1px solid #333; background: #1a1a2e; color: white; margin-bottom: 5px; text-align: center; width: 100%; box-sizing: border-box; }
        
        #my-id-container { font-size: 11px; opacity: 0.8; margin-bottom: 15px; cursor: pointer; padding: 5px; border-radius: 4px; border: 1px dashed rgba(255,255,255,0.2); }

        /* Skip Static UI */
        .checkbox-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 15px 0;
            padding: 8px;
            background: rgba(0, 242, 255, 0.05);
            border-radius: 8px;
            border: 1px solid rgba(0, 242, 255, 0.1);
        }
        .checkbox-container input { cursor: pointer; width: 18px; height: 18px; accent-color: var(--neon); }
        .checkbox-container label { font-size: 11px; color: var(--neon); cursor: pointer; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>

<div id="host-left-alert">CONNECTION LOST: HOST LEFT THE SESSION</div>

<div id="main-body" class="pulsing">
    <div id="setup-menu">
        <h1 style="color: var(--neon); letter-spacing: 4px; margin-bottom: 5px;">NEON REBOUND</h1>
        
        <input type="text" id="name-input" placeholder="ENTER PILOT NAME" maxlength="12" oninput="updateMyName()">
        
        <div id="player-list">
            <div style="font-size: 10px; color: #5465ff; margin-bottom: 5px; font-weight: bold;">LOBBY PILOTS:</div>
            <div id="lobby-list-content"></div>
        </div>

        <div style="display: flex; gap: 5px;">
            <input type="text" id="seed-input" placeholder="MAP SEED">
            <button class="secondary-btn" onclick="generateNewSeed()" id="seed-btn" style="white-space: nowrap;">New Seed</button>
        </div>

        <div class="checkbox-container" id="skip-container">
            <input type="checkbox" id="skip-static-checkbox">
            <label for="skip-static-checkbox">Skip Static (Start @ 1500m)</label>
        </div>
        
        <button class="start-btn" id="main-start-btn" onclick="requestStart()">Launch Mission</button>
        <p id="guest-wait-info" style="display:none; color: #aaa; font-size: 12px;">Waiting for Host to start...</p>
        
        <div id="multiplayer-menu" style="margin-top: 15px; border-top: 1px solid #333; padding-top: 10px;">
            <div id="my-id-container" onclick="copyIdToClipboard()">
                <span id="my-id-value" style="font-weight: bold; color: var(--neon);">CONNECTING...</span>
                <span id="copy-hint" style="display:block; font-size: 9px;">(Click to copy ID)</span>
            </div>
            <input type="text" id="join-id" placeholder="PASTE FRIEND'S ID">
            <button style="padding: 6px 15px; cursor: pointer; width: 100%; margin-top: 5px;" onclick="connectToPeer()">CONNECT TO PILOT</button>
        </div>
    </div>

    <div class="game-wrapper" id="game-wrapper">
        <div id="game-container">
            <div id="ui">
                <div class="ui-element">SCORE: <span id="score">0</span></div>
                <div id="seed-display" style="font-size: 10px; color: rgba(255,255,255,0.5); text-transform: uppercase;">SEED: <span id="current-seed-tag">---</span></div>
            </div>

            <div id="announce">HARDER!</div>
            <div id="spec-msg">WATCHING PILOT...</div>
            
            <div id="player" class="player-box"><div class="name-tag" id="my-name-tag"></div></div>
            <div id="opponent" class="player-box"><div class="name-tag" id="opp-name-tag"></div></div>
            
            <div id="overlay">
                <h1 style="color: var(--warning); margin: 0;">MISSION FAILED</h1>
                <table class="score-board" id="final-leaderboard"></table>
                <div id="restart-area">
                    <button class="start-btn" onclick="requestStart()">Rematch</button>
                    <button class="secondary-btn" onclick="backToLobby()" style="color: white; border-color: white;">Back to Lobby</button>
                </div>
                <p id="guest-restart-info" style="display:none; color: var(--neon);">Waiting for Host...</p>
            </div>
        </div>

        <div id="live-leaderboard">
            <div class="leaderboard-title">Live Tracking</div>
            <div id="live-list-content-game"></div>
        </div>
    </div>
</div>

<script>
    const wrapper = document.getElementById('game-wrapper');
    const container = document.getElementById('game-container');
    const playerEl = document.getElementById('player');
    const opponentEl = document.getElementById('opponent');
    const scoreEl = document.getElementById('score');
    const seedTag = document.getElementById('current-seed-tag');
    const announceEl = document.getElementById('announce');
    const specMsgEl = document.getElementById('spec-msg');
    const overlay = document.getElementById('overlay');
    const setupMenu = document.getElementById('setup-menu');
    const lobbyContent = document.getElementById('lobby-list-content');
    const liveListGame = document.getElementById('live-list-content-game');
    const hostLeftAlert = document.getElementById('host-left-alert');
    const skipCheckbox = document.getElementById('skip-static-checkbox');

    const GRAVITY = 1600; 
    const JUMP_FORCE = -650;
    const HORIZONTAL_SPEED = 400;
    const WIDTH = 400;
    const HEIGHT = 600;

    let globalSeed = 0;
    let currentSeedText = "";
    let myAbsHeight = 0; 
    let player = { x: 185, y: 500, vx: 0, vy: 0, name: "PILOT", finalScore: 0 };
    let opponent = { x: 185, absY: 500, targetX: 185, targetAbsY: 500, dead: false, active: false, name: "CO-PILOT", finalScore: 0, currentLiveScore: 0 };
    let platforms = [];
    let cameraY = 0; 
    let highestWorldY = 600; 
    let keys = {};
    let isGameOver = false, isRunning = false;
    let lastTime = 0, isHost = false, isConnected = false, myPeerId = "";
    let difficultyState = 0; 

    function seededRandom(worldY) {
        let x = Math.sin(worldY + globalSeed) * 10000;
        return x - Math.floor(x);
    }

    function updateLobbyUI() {
        let html = `<div class="player-entry"><span><span class="status-dot"></span>${player.name} (YOU)</span></div>`;
        if (opponent.active) html += `<div class="player-entry"><span><span class="status-dot"></span>${opponent.name}</span> <span style="font-size: 9px; opacity: 0.5;">READY</span></div>`;
        lobbyContent.innerHTML = html;
        if (isConnected && !isHost) {
            document.getElementById('skip-container').style.opacity = "0.5";
            skipCheckbox.disabled = true;
        }
    }

    function updateMyName() {
        player.name = document.getElementById('name-input').value || "PILOT";
        updateLobbyUI();
        if (isConnected) conn.send({ type: 'name-sync', name: player.name });
    }

    function generateNewSeed() {
        if (!isHost && isConnected) return;
        document.getElementById('seed-input').value = Math.random().toString(36).substring(7).toUpperCase();
    }

    function backToLobby() {
        isRunning = false; wrapper.style.display = 'none';
        setupMenu.style.display = 'block'; overlay.style.display = 'none';
        hostLeftAlert.style.display = 'none';
    }

    let peer = new Peer();
    let conn;
    peer.on('open', id => { myPeerId = id; document.getElementById('my-id-value').innerText = "YOUR ID: " + id; updateLobbyUI(); });
    peer.on('connection', c => { conn = c; isHost = true; isConnected = true; setupConnection(); });

    function copyIdToClipboard() {
        if (!myPeerId) return;
        navigator.clipboard.writeText(myPeerId);
        document.getElementById('copy-hint').innerText = "COPIED!";
        setTimeout(() => document.getElementById('copy-hint').innerText = "(Click to copy ID)", 2000);
    }

    function connectToPeer() {
        const id = document.getElementById('join-id').value.trim();
        if(!id) return;
        conn = peer.connect(id); isHost = false; isConnected = true; setupConnection();
    }

    function setupConnection() {
        conn.on('open', () => {
            if (!isHost) {
                document.getElementById('main-start-btn').style.display = 'none';
                document.getElementById('seed-btn').style.display = 'none';
                document.getElementById('guest-wait-info').style.display = 'block';
            } else if (isRunning) {
                conn.send({ type: 'start-game', seed: currentSeedText, skip: skipCheckbox.checked });
            }
            conn.send({ type: 'name-sync', name: player.name });
            updateLobbyUI();
        });
        conn.on('close', () => {
            if (!isHost) hostLeftAlert.style.display = 'block';
            opponent.active = false; updateLobbyUI();
        });
        conn.on('data', data => {
            if (data.type === 'name-sync') { opponent.name = data.name; opponent.active = true; updateLobbyUI(); }
            if (data.type === 'start-game') { 
                document.getElementById('seed-input').value = data.seed; 
                skipCheckbox.checked = data.skip;
                initGame(data.seed, data.skip); 
            }
            if (data.type === 'pos') { 
                opponent.targetX = data.x; opponent.targetAbsY = data.absY; opponent.dead = data.dead; 
                opponent.finalScore = data.currentScore; opponent.currentLiveScore = data.currentScore;
                opponent.active = true; 
            }
        });
    }

    function requestStart() {
        const seed = document.getElementById('seed-input').value || "MISSION_1";
        const skip = skipCheckbox.checked;
        if (isConnected && isHost) conn.send({ type: 'start-game', seed: seed, skip: skip });
        if (!isConnected || isHost) initGame(seed, skip);
    }

    function initGame(seedText, skipToMoving) {
        currentSeedText = seedText;
        seedTag.innerText = seedText;
        globalSeed = seedText.split('').reduce((a,b) => (a << 5) - a + b.charCodeAt(0), 0);

        player.x = 185; player.y = 500; player.vx = 0; player.vy = 0; player.finalScore = 0;
        isGameOver = false; isRunning = true; platforms = [];
        
        // Skip-logiikka
        if (skipToMoving) {
            myAbsHeight = 1500;
            cameraY = 15000;
            highestWorldY = -15000 + 600;
            difficultyState = 2; // Ohitetaan helpot tasot
        } else {
            myAbsHeight = 0;
            cameraY = 0;
            highestWorldY = 600; 
            difficultyState = 0;
        }

        opponent.dead = false; opponent.finalScore = 0; opponent.currentLiveScore = 0;
        opponent.x = 185; opponent.absY = (500 - cameraY);
        
        scoreEl.innerText = Math.floor(myAbsHeight); 
        specMsgEl.style.display = 'none'; hostLeftAlert.style.display = 'none';
        document.getElementById('my-name-tag').innerText = player.name;
        document.getElementById('opp-name-tag').innerText = opponent.name;
        
        container.querySelectorAll('.platform').forEach(p => p.remove());
        
        // Aloitusplatform pelaajan alle
        createPlatform(150, (550 - cameraY), 100, 0);
        
        // Generoidaan alkualue
        while (highestWorldY > -cameraY - 100) {
            highestWorldY -= 80;
            spawnPlatformAt(highestWorldY);
        }
        
        overlay.style.display = 'none'; setupMenu.style.display = 'none'; wrapper.style.display = 'block';
        if (isConnected && !isHost) { document.getElementById('restart-area').style.display = 'none'; document.getElementById('guest-restart-info').style.display = 'block'; }
        requestAnimationFrame(gameLoop);
    }

    function createPlatform(x, worldY, w, mvSpeed) {
        const el = document.createElement('div');
        el.className = 'platform'; el.style.width = w + 'px';
        container.appendChild(el);
        platforms.push({ x, worldY, w, el, mvSpeed });
    }

    function spawnPlatformAt(worldY) {
        let rand = seededRandom(worldY);
        let h = Math.abs(worldY);
        let score = h / 10;
        
        let minW = 60, maxW = 100;
        if (score > 500) {
            let shrink = Math.min(40, (score - 500) / 50);
            minW -= shrink; maxW -= shrink;
        }
        
        let w = rand * (maxW - minW) + minW;
        let x = rand * (WIDTH - w);
        
        let mvSpeed = 0;
        if (score > 1500) {
            mvSpeed = (rand > 0.5 ? 1 : -1) * (60 + (score / 25));
        }
        
        createPlatform(x, worldY, w, mvSpeed);
    }

    function updateLiveLeaderboard() {
        let pList = [{name: player.name, score: Math.floor(myAbsHeight), dead: isGameOver}];
        if(opponent.active) pList.push({name: opponent.name, score: opponent.currentLiveScore, dead: opponent.dead});
        pList.sort((a,b) => b.score - a.score);
        
        let html = "";
        pList.forEach(p => {
            let color = p.name === player.name ? "var(--neon)" : "#ff00ff";
            let status = p.dead ? '<span style="color:red; font-size:9px;">[OUT]</span> ' : '<span style="color:#00ff00; font-size:9px;">[LIVE]</span> ';
            html += `<div class="live-entry">
                        <span style="font-size:10px; color:${color}; opacity:0.8;">${status}${p.name}</span>
                        <span class="live-score" style="color:${color}">${p.score}</span>
                     </div>`;
        });
        liveListGame.innerHTML = html;
    }

    function gameLoop(timestamp) {
        if (!isRunning) return;
        let dt = (timestamp - lastTime) / 1000;
        lastTime = timestamp;
        if (dt > 0.1 || isNaN(dt)) dt = 0.016;

        updateLiveLeaderboard();

        if (opponent.active) {
            opponent.x += (opponent.targetX - opponent.x) * 0.2;
            opponent.absY += (opponent.targetAbsY - opponent.absY) * 0.2;
        }

        if (!isGameOver) {
            updatePlayer(dt);
            if (difficultyState === 0 && myAbsHeight >= 500) { difficultyState = 1; showAnnounce("HARDER!"); }
            else if (difficultyState === 1 && myAbsHeight >= 1500) { difficultyState = 2; showAnnounce("HARDER!"); }
        } else if (opponent.active && !opponent.dead) {
            let targetCameraY = (HEIGHT / 2) - opponent.absY;
            cameraY += (targetCameraY - cameraY) * 0.1;
            specMsgEl.style.display = 'block';
            specMsgEl.innerText = `WATCHING ${opponent.name}...`;
            
            while (highestWorldY > opponent.absY - HEIGHT) {
                highestWorldY -= 80;
                spawnPlatformAt(highestWorldY);
            }
        }

        platforms.forEach(p => {
            if (p.mvSpeed !== 0) {
                p.x += p.mvSpeed * dt;
                if (p.x < 0) { p.x = 0; p.mvSpeed = Math.abs(p.mvSpeed); }
                else if (p.x + p.w > WIDTH) { p.x = WIDTH - p.w; p.mvSpeed = -Math.abs(p.mvSpeed); }
            }
        });

        platforms = platforms.filter(p => {
            if (p.worldY + cameraY > HEIGHT + 300) {
                p.el.remove();
                return false;
            }
            return true;
        });

        if (isGameOver && (!opponent.active || opponent.dead)) showEndScreen();
        if (isConnected && conn.open) conn.send({ type: 'pos', x: player.x, absY: (player.y - cameraY), dead: isGameOver, currentScore: Math.floor(myAbsHeight) });
        
        render();
        requestAnimationFrame(gameLoop);
    }

    function showAnnounce(msg) { announceEl.innerText = msg; announceEl.style.display = 'block'; setTimeout(() => announceEl.style.display = 'none', 3000); }

    function updatePlayer(dt) {
        if (keys['ArrowLeft']) player.vx = -HORIZONTAL_SPEED;
        else if (keys['ArrowRight']) player.vx = HORIZONTAL_SPEED;
        else player.vx *= Math.pow(0.01, dt);
        
        player.vy += GRAVITY * dt;
        player.x += player.vx * dt;
        player.y += player.vy * dt;
        
        if (player.x > WIDTH) player.x = -25;
        if (player.x < -25) player.x = WIDTH;

        platforms.forEach(p => {
            let screenY = p.worldY + cameraY;
            if (player.vy > 0 && player.x < p.x + p.w && player.x + 25 > p.x && player.y + 25 > screenY && player.y + 25 < screenY + 15) player.vy = JUMP_FORCE;
        });

        if (player.y < HEIGHT / 2) { 
            let diff = HEIGHT / 2 - player.y; 
            cameraY += diff;
            myAbsHeight += diff / 10; 
            scoreEl.innerText = Math.floor(myAbsHeight);
            player.y = HEIGHT / 2; 

            while (highestWorldY > -cameraY - 100) {
                highestWorldY -= 80;
                spawnPlatformAt(highestWorldY);
            }
        }
        if (player.y > HEIGHT) { isGameOver = true; player.finalScore = Math.floor(myAbsHeight); }
    }

    function render() {
        playerEl.style.transform = `translate(${player.x}px, ${player.y}px)`;
        playerEl.style.display = isGameOver ? 'none' : 'block';
        
        if (opponent.active) {
            opponentEl.style.display = 'block';
            let oppScreenY = opponent.absY + cameraY;
            opponentEl.style.transform = `translate(${opponent.x}px, ${oppScreenY}px)`;
            opponentEl.style.opacity = opponent.dead ? "0.1" : "0.8";
        }
        
        platforms.forEach(p => {
            p.el.style.transform = `translate(${p.x}px, ${p.worldY + cameraY}px)`;
        });
    }

    function showEndScreen() {
        overlay.style.display = 'flex'; specMsgEl.style.display = 'none';
        const table = document.getElementById('final-leaderboard');
        let pilots = [{ name: player.name, score: Math.floor(myAbsHeight) }];
        if (opponent.active) pilots.push({ name: opponent.name, score: opponent.finalScore });
        pilots.sort((a, b) => b.score - a.score);
        let html = "";
        pilots.forEach((pilot, index) => {
            const isWinner = index === 0;
            html += `<tr><td>${pilot.name}</td><td style="text-align:right" class="${isWinner ? 'winner' : ''}">${pilot.score}</td></tr>`;
        });
        table.innerHTML = html;
    }

    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);
</script>
</body>
</html>
